[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/application",
    "crates/common",
    "crates/domain",
    "crates/infra_db",
    "crates/infra_email",
    "crates/infra_media",
    "crates/infra_oidc",
    "crates/infra_push",
    "crates/worker",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
gathr-application = { path = "crates/application" }
gathr-common = { path = "crates/common" }
gathr-domain = { path = "crates/domain" }
gathr-infra-db = { path = "crates/infra_db" }
gathr-infra-email = { path = "crates/infra_email" }
gathr-infra-media = { path = "crates/infra_media" }
gathr-infra-oidc = { path = "crates/infra_oidc" }
gathr-infra-push = { path = "crates/infra_push" }

actix-web = "4"
anyhow = "1"
dotenvy = "0.15"
jsonwebtoken = "9"
minijinja = "2"
rand = "0.8"
actix-ws = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
    "json",
] }
thiserror = "2"
time = { version = "0.3", features = [
    "serde",
    "serde-well-known",
    "formatting",
    "parsing",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
