<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ heading }} · Gathr</title>
<style>
:root { --canvas: #f2f3f5; --surface: #fff; --text: #111214; --muted: #8e8e93; --accent: #007aff; }
@media (prefers-color-scheme: dark) {
  :root { --canvas: #0b0b0c; --surface: #1c1c1e; --text: #fff; --muted: #98989f; --accent: #0a84ff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  display: grid; place-items: center; min-height: 100vh; }
.card { background: var(--surface); border-radius: 20px; padding: 32px 24px;
  max-width: 420px; margin: 20px; text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.06); }
h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: -.2px; }
p { color: var(--muted); margin: 0 0 20px; }
a { display: inline-block; color: var(--accent); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>{{ heading }}</h1>
  <p>{{ detail }}</p>
  {% if back_url %}<a href="{{ back_url }}">Back to the invite</a>{% endif %}
</div>
</body>
</html>
