name: Gathr
options:
  bundleIdPrefix: app.gathr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Models:
    path: Packages/Models
  DesignSystem:
    path: Packages/DesignSystem
  Networking:
    path: Packages/Networking
  Features:
    path: Packages/Features

targets:
  Gathr:
    type: application
    platform: iOS
    sources:
      - path: GathrApp
    dependencies:
      - package: Models
        product: Models
      - package: DesignSystem
        product: DesignSystem
      - package: Networking
        product: Networking
      - package: Features
        product: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gathr.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    entitlements:
      path: GathrApp/Gathr.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: GathrApp/Info.plist
      properties:
        CFBundleDisplayName: Gathr
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Gathr uses the camera to scan invite QR codes.
        GathrAPIBaseURL: http://127.0.0.1:8080
        GathrGoogleClientID: "181083896548-6c7f89t0a4s1tookcppdtu7aqe166pte.apps.googleusercontent.com"
        GathrAllowDevSignIn: true

  GathrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GathrUITests
    dependencies:
      - target: Gathr
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.gathr.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gathr

schemes:
  Gathr:
    build:
      targets:
        Gathr: all
        GathrUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GathrUITests
